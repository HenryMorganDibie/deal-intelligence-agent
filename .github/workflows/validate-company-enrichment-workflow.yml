name: validate-company-enrichment-workflow

on:
  pull_request:
    paths:
      - ".github/workflows/company-web-enrichment.yml"
      - ".github/workflows/validate-company-enrichment-workflow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: Validate company enrichment workflow syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Run actionlint against the worker workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/company-web-enrichment.yml
