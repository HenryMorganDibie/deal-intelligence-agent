# Monthly walk-forward backtest, spread across four machines and kept inside the free Actions allowance.
#
# Budget: one run a month, worst case about 860 minutes (plan 20 + four shards x 200 + finish 40) plus
# about 50 for the weekly cache touch, so even
# a second, manual run stays under the 2,000 free minutes a private repository gets. Every job has a hard
# timeout, there are no automatic re-runs, and data moves between jobs through the Actions cache (free,
# 10 GB) rather than artifacts, which count against paid storage. An account without a payment method is
# never charged: past the allowance GitHub stops starting jobs.
#
# Progress accumulates. The run continues the published period while some of its companies are still to
# run, and publishes whenever it covers more companies than the site shows; once the period is complete it
# moves on to the latest one. A month that does not finish loses nothing.
#
#   plan    which companies are left, split into four shards.
#   shard   one machine per shard (each has its own address, so news searches are not throttled
#           together), working to a deadline; it caches what it fetched and finished.
#   finish  merges the shards, publishes if the result improves on the site, saves the merged cache.
# A follow-up push-triggered run resumes any companies left uncovered by the first budgeted pass.
name: Monthly backtest

on:
  push:
    paths:
      - ".github/workflows/backtest.yml"
  schedule:
    - cron: "17 3 2 * *"            # 03:17 UTC on the 2nd of every month: the backtest
    - cron: "41 4 * * 1"            # Mondays: touch the cache, which GitHub deletes after 7 unused days
  workflow_dispatch:

permissions:
  contents: write                    # commit the regenerated results
  actions: write                     # delete this run's shard caches and superseded caches

concurrency:
  group: backtest-${{ github.event.schedule == '41 4 * * 1' && 'keepalive' || 'run' }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  keep-cache:
    if: github.event.schedule == '41 4 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Restore the latest backtest cache (keeps it from expiring)
        uses: actions/cache/restore@v4
        with:
          path: |
            data/hist_cache
            data/backtest_runs
          key: backtest-keepalive-${{ github.run_id }}
          restore-keys: backtest-

      - name: Restore the progress archive (keeps it from expiring)
        uses: actions/cache/restore@v4
        with:
          path: btstate
          key: btstate-keepalive-${{ github.run_id }}
          restore-keys: btstate-

  plan:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.schedule == '17 3 2 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      start: ${{ steps.plan.outputs.start }}
      end: ${{ steps.plan.outputs.end }}
      remaining: ${{ steps.plan.outputs.remaining }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-backtest.txt
      - run: pip install -r requirements-backtest.txt

      - name: Restore finished companies
        uses: actions/cache/restore@v4
        with:
          path: |
            data/hist_cache
            data/backtest_runs
          key: backtest-plan-${{ github.run_id }}
          restore-keys: backtest-

      # Progress is cached as one archive: caching the directories file by file fails once they hold
      # hundreds of thousands of files. Older directory caches above are still read for continuity.
      - name: Restore the progress archive
        uses: actions/cache/restore@v4
        with:
          path: btstate
          key: btstate-plan-${{ github.run_id }}
          restore-keys: btstate-

      - name: Unpack the progress archive
        run: if [ -f btstate/state.tgz ]; then mkdir -p data && tar -xzf btstate/state.tgz --skip-old-files; fi; true

      - name: Add the committed seed (finished companies not yet in the cache)
        run: |
          mkdir -p data/backtest_runs
          for f in seed/backtest_runs_*.tgz; do [ -f "$f" ] && tar -xzf "$f" -C data/backtest_runs --skip-old-files; done; true

      - name: Refresh the universe when a new period starts
        continue-on-error: true      # on failure, the committed universe is used
        run: |
          python - <<'PY' > period.txt
          from datetime import date
          from src.engines.historical_backtest import current_period
          s, e, _ = current_period(date.today())
          print(f"data/backtest_runs/{s}_{e}")
          PY
          dir=$(cat period.txt)
          if [ ! -d "$dir" ] || [ -z "$(ls -A "$dir")" ]; then python main.py backtest --universe; fi

      - name: Split the unfinished companies into four shards
        id: plan
        run: |
          python main.py backtest --plan-shards 4 --period continue > plan.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p = json.load(open("plan.json"))
          print(f"start={p['start']}\nend={p['end']}\nremaining={p['remaining']}")
          print("matrix=" + json.dumps({"include": p["shards"]}))
          PY
          echo "$(python -c "import json; p=json.load(open('plan.json')); print(p['remaining'], 'companies to run for', p['start'], 'to', p['end'])")"

      - name: Hand the universe to the shards
        uses: actions/cache/save@v4
        with:
          path: docs/backtest_universe.csv
          key: btuniverse-${{ github.run_id }}

  shard:
    needs: plan
    if: needs.plan.outputs.remaining != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 200             # hard cap: 4 x 200 minutes at most per month
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      DEAL_INTEL_NEWS_INTERVAL: "0.25"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-backtest.txt
      - run: pip install -r requirements-backtest.txt

      - name: Restore fetched data
        uses: actions/cache/restore@v4
        with:
          path: |
            data/hist_cache
            data/backtest_runs
          key: backtest-shard-${{ github.run_id }}
          restore-keys: backtest-

      # Progress is cached as one archive: caching the directories file by file fails once they hold
      # hundreds of thousands of files. Older directory caches above are still read for continuity.
      - name: Restore the progress archive
        uses: actions/cache/restore@v4
        with:
          path: btstate
          key: btstate-shard-${{ github.run_id }}
          restore-keys: btstate-

      - name: Unpack the progress archive
        run: if [ -f btstate/state.tgz ]; then mkdir -p data && tar -xzf btstate/state.tgz --skip-old-files; fi; true

      - uses: actions/cache/restore@v4
        with:
          path: docs/backtest_universe.csv
          key: btuniverse-${{ github.run_id }}

      # Companies already running at the deadline may take a while to finish, so the run is also stopped
      # outright at 160 minutes; that leaves the job's last 40 minutes for packing and saving progress.
      - name: Run this shard (stops starting companies after 125 minutes, stops outright at 160)
        run: |
          mkdir -p data/hist_cache data/backtest_runs && touch .shard-start
          printf '%s' "${{ matrix.tickers }}" > tickers.txt
          status=0
          timeout --signal=INT --kill-after=60 160m \
            python main.py backtest --historical --period continue --tickers @tickers.txt --no-aggregate \
              --workers 8 --deadline-minutes 125 || status=$?
          if [ "$status" -eq 124 ] || [ "$status" -eq 130 ] || [ "$status" -eq 137 ]; then
            echo "Stopped at the hard limit; finished companies are kept for the next run."
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - name: Stop the run before packing (after a cancel or timeout it may still be writing)
        if: always()
        run: pkill -INT -f "main.py backtest" && sleep 15; pkill -KILL -f "main.py backtest"; find data -name "*.tmp" -delete; true

      - name: Pack what this shard fetched and finished
        if: always()
        run: |
          mkdir -p shard-delta-${{ matrix.shard }}
          find data/hist_cache data/backtest_runs -type f -newer .shard-start -print0 \
            | tar --null -czf shard-delta-${{ matrix.shard }}/delta.tgz -T -
          ls -l shard-delta-${{ matrix.shard }}/delta.tgz

      - name: Hand it to the finish job
        if: always()
        uses: actions/cache/save@v4
        with:
          path: shard-delta-${{ matrix.shard }}
          key: btdelta-${{ github.run_id }}-${{ matrix.shard }}

  finish:
    needs: [plan, shard]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-backtest.txt
      - run: pip install -r requirements-backtest.txt

      - name: Restore fetched data and finished companies
        uses: actions/cache/restore@v4
        with:
          path: |
            data/hist_cache
            data/backtest_runs
          key: backtest-finish-${{ github.run_id }}
          restore-keys: backtest-

      # Progress is cached as one archive: caching the directories file by file fails once they hold
      # hundreds of thousands of files. Older directory caches above are still read for continuity.
      - name: Restore the progress archive
        uses: actions/cache/restore@v4
        with:
          path: btstate
          key: btstate-finish-${{ github.run_id }}
          restore-keys: btstate-

      - name: Unpack the progress archive
        run: if [ -f btstate/state.tgz ]; then mkdir -p data && tar -xzf btstate/state.tgz --skip-old-files; fi; true

      - uses: actions/cache/restore@v4
        with:
          path: docs/backtest_universe.csv
          key: btuniverse-${{ github.run_id }}

      # One step per shard (the plan always makes at most four); a shard that cached nothing is skipped.
      - uses: actions/cache/restore@v4
        with:
          path: shard-delta-1
          key: btdelta-${{ github.run_id }}-1
      - uses: actions/cache/restore@v4
        with:
          path: shard-delta-2
          key: btdelta-${{ github.run_id }}-2
      - uses: actions/cache/restore@v4
        with:
          path: shard-delta-3
          key: btdelta-${{ github.run_id }}-3
      - uses: actions/cache/restore@v4
        with:
          path: shard-delta-4
          key: btdelta-${{ github.run_id }}-4

      - name: Merge the seed and every shard
        run: |
          mkdir -p data/hist_cache data/backtest_runs
          for f in seed/backtest_runs_*.tgz; do [ -f "$f" ] && tar -xzf "$f" -C data/backtest_runs --skip-old-files; done
          for f in shard-delta-*/delta.tgz; do [ -f "$f" ] && tar -xzf "$f"; done
          python main.py backtest --plan-shards 1 --period continue \
            | python -c "import json,sys; p=json.load(sys.stdin); print(p['remaining'], 'companies still to run for', p['start'], 'to', p['end'])"

      - name: Publish if it improves on the site
        run: python main.py backtest --publish --period continue

      - name: Evaluate return forecast candidate
        run: python -m src.engines.return_forecast > docs/return_forecast_validation.json

      - name: Pack fetched data and finished companies into one archive
        if: always()
        run: mkdir -p btstate && tar -czf btstate/state.tgz data/hist_cache data/backtest_runs && ls -l btstate/state.tgz

      - name: Keep fetched data and finished companies
        id: save
        if: always()
        uses: actions/cache/save@v4
        with:
          path: btstate
          key: btstate-${{ github.run_id }}

      - name: Free cache space (this run's hand-offs and superseded caches)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --limit 100 --json key --jq '.[].key' > keys.txt
          # A failed save is only a warning, so delete nothing unless this run's archive is really stored:
          # the shard hand-offs are the only other copy of the work.
          if ! grep -qx "btstate-${{ github.run_id }}" keys.txt; then
            echo "::warning::Progress archive not stored; keeping this run's shard hand-offs and older caches."
            exit 0
          fi
          grep -E "^(btdelta|btuniverse)-${{ github.run_id }}" keys.txt | while read -r k; do gh cache delete "$k"; done
          grep -E "^(btstate|backtest)-" keys.txt | grep -vx "btstate-${{ github.run_id }}" | while read -r k; do gh cache delete "$k"; done
          true

      - name: Commit the results
        run: |
          git config user.name "Henry Dibie"
          git config user.email "henrymorgandibie@gmail.com"
          git add docs/evaluation_report.json docs/backtest_predictions.csv docs/backtest_summary.json \
                  docs/BACKTEST.md docs/backtest_universe.csv docs/return_forecast_validation.json \
                  src/data/measured_outcomes.json
          if git diff --cached --quiet; then echo "Nothing new to publish."; exit 0; fi
          git commit -m "backtest: monthly replay ${{ needs.plan.outputs.start }} to ${{ needs.plan.outputs.end }}"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
