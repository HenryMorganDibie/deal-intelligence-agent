name: Web quality gates

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "supabase/**"
      - ".github/workflows/web-quality-gates.yml"
  pull_request:
    branches: [main, feature/markets-investment-intelligence]
    paths:
      - "web/**"
      - "supabase/**"
      - ".github/workflows/web-quality-gates.yml"

permissions:
  contents: read

concurrency:
  group: web-quality-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  database-rls-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Start isolated local Supabase stack
        run: supabase start -x studio,mailpit,storage-api,imgproxy,edge-runtime,logflare,vector
      - name: Apply migrations and run pgTAP security tests
        run: supabase test db
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Markets unit tests
        run: npm run test:markets
      - name: ESLint
        run: npm run lint
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Production build
        run: NEXT_PUBLIC_API_URL=http://127.0.0.1:3000 NEXT_PUBLIC_SITE_URL=https://test.example npm run build
      - name: Install temporary browser-test dependency outside the app workspace
        run: npm install --prefix /tmp/markets-playwright @playwright/test@1.56.1
      - name: Install Chromium for interactive acceptance tests
        run: NODE_PATH=/tmp/markets-playwright/node_modules /tmp/markets-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser acceptance tests
        run: NODE_PATH=/tmp/markets-playwright/node_modules /tmp/markets-playwright/node_modules/.bin/playwright test --config=playwright.config.cjs
