name: Historical deal backfill

# Fills the deal and corporate-event store month by month, back to January 2010. Each request
# covers one calendar month, so a timeout or feed failure costs one month and can be re-run;
# re-running a month merges into the records already stored rather than duplicating them, and
# backfills never send watchlist alerts. One job per year, at most two at a time, to stay gentle
# on news feeds and inside the free Actions allowance (roughly 30 to 50 minutes per year).
on:
  workflow_dispatch:
    inputs:
      from_year:
        description: "First year to backfill (2010 or later)"
        required: true
        default: "2010"
      to_year:
        description: "Last year to backfill (defaults to last year)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: historical-backfill
  cancel-in-progress: false

env:
  SUPABASE_URL: https://ygvpormskihofvgntldo.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_oEqYxYLm60MdGk5JA-QfgQ_6z7uSozn
  DEAL_INTEL_APP_URL: https://deal-intelligence.app
  DEAL_INTEL_API_SECRET: ${{ secrets.DEAL_INTEL_API_SECRET }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
  OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
  SENDBYTE_API_KEY: ${{ secrets.SENDBYTE_API_KEY }}

jobs:
  years:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.years.outputs.matrix }}
    steps:
      - id: years
        env:
          FROM_YEAR: ${{ inputs.from_year }}
          TO_YEAR: ${{ inputs.to_year }}
        run: |
          set -euo pipefail
          from="${FROM_YEAR:-2010}"
          to="${TO_YEAR:-$(( $(date -u +%Y) - 1 ))}"
          if [ "$from" -lt 2010 ]; then echo "::error::History starts in 2010."; exit 1; fi
          if [ "$to" -lt "$from" ]; then echo "::error::to_year is before from_year."; exit 1; fi
          echo "matrix=$(seq "$from" "$to" | jq -R 'tonumber' | jq -cs '{year: .}')" >> "$GITHUB_OUTPUT"

  backfill:
    needs: years
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.years.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install the API's dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Backfill ${{ matrix.year }}, one month per call
        env:
          YEAR: ${{ matrix.year }}
        run: |
          set -uo pipefail
          failed=()
          for m in 01 02 03 04 05 06 07 08 09 10 11 12; do
            month="${YEAR}-${m}"
            if [[ "$month" > "$(date -u +%Y-%m)" ]]; then break; fi
            echo "Backfilling ${month}"
            python scripts/run_cron.py "/api/cron/ingest?month=${month}" > out.txt 2>&1 || failed+=("$month")
            grep -E "HTTP|::error" out.txt || true
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::warning::Months to re-run for ${YEAR}: ${failed[*]}"
            exit 1
          fi
