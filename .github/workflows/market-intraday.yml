name: Market intraday

# Delayed intraday quotes (Johannesburg from Yahoo, about 15 minutes behind; Lagos from NGX's own list), plus
# ETFs, Treasury bills, bonds, policy and deposit rates and unlisted funds, hourly through Johannesburg and Lagos
# trading hours (07:12 to 15:12 UTC) on weekdays. Runs on GitHub's runner, not as a Vercel function. The daily
# snapshot supersedes the quotes.
on:
  schedule:
    - cron: "12 7-15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-intraday
  cancel-in-progress: true

env:
  SUPABASE_URL: https://ygvpormskihofvgntldo.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_oEqYxYLm60MdGk5JA-QfgQ_6z7uSozn
  DEAL_INTEL_APP_URL: https://deal-intelligence.app
  DEAL_INTEL_API_SECRET: ${{ secrets.DEAL_INTEL_API_SECRET }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
  OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
  SENDBYTE_API_KEY: ${{ secrets.SENDBYTE_API_KEY }}

jobs:
  intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install the API's dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Refresh intraday quotes and instruments
        run: python scripts/run_cron.py /api/cron/market-intraday
