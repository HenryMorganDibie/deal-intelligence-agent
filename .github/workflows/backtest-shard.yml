# One shard of a backtest spread across machines: runs only the given tickers and uploads their
# per-company results as an artifact, to be merged and aggregated elsewhere. Each runner has its own
# address, so news searches are not throttled together.
name: Backtest shard

on:
  workflow_dispatch:
    inputs:
      start: {description: "First as-of date", required: true, default: "2024-01-15"}
      end: {description: "Last as-of date", required: true, default: "2025-06-15"}
      shard: {description: "Shard label", required: true, default: "1"}
      tickers: {description: "Comma-separated tickers", required: true}

permissions:
  contents: read

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      PYTHONUNBUFFERED: "1"
      DEAL_INTEL_NEWS_INTERVAL: "0.25"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-backtest.txt
      - run: pip install -r requirements-backtest.txt
      - name: Run the shard
        run: |
          printf '%s' "${{ inputs.tickers }}" > tickers.txt
          python main.py backtest --historical --start "${{ inputs.start }}" --end "${{ inputs.end }}" \
            --tickers @tickers.txt --no-aggregate --workers 8 --deadline-minutes 300
      - name: Upload per-company results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-shard-${{ inputs.shard }}
          path: data/backtest_runs/
          retention-days: 7
