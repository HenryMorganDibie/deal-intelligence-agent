name: Scheduled API jobs

# The API's daily jobs, run on GitHub's runners instead of as Vercel functions (scripts/run_cron.py calls the same
# route handlers in-process), so they cost no Vercel function time:
#   04:11 and 15:11 UTC  deal and event ingestion, then watchlist webhooks and alert emails
#                        (before the African working day opens, and after the exchanges close)
#   06:17 UTC            label brief outcomes for calibration
#   06:53 UTC            refresh the showcase
#   hourly at :37        election news from Nigerian publishers' feeds (src/election_feed.py), then the new
#                        stories' full articles read with web-harvester and the stories re-tagged, then any
#                        imported result sheets read within the day's budget (a no-op when none are queued)
# GitHub can start scheduled runs late at busy times; each job is safe to run late or twice.
on:
  schedule:
    - cron: "11 4 * * *"
    - cron: "11 15 * * *"
    - cron: "17 6 * * *"
    - cron: "53 6 * * *"
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Job to run"
        required: true
        default: ingest
        type: choice
        options: [ingest, label, showcase, election-news]

permissions:
  contents: read

concurrency:
  group: scheduled-api-jobs-${{ github.event.schedule || inputs.job }}
  cancel-in-progress: false

env:
  SUPABASE_URL: https://ygvpormskihofvgntldo.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_oEqYxYLm60MdGk5JA-QfgQ_6z7uSozn
  DEAL_INTEL_APP_URL: https://deal-intelligence.app
  DEAL_INTEL_API_SECRET: ${{ secrets.DEAL_INTEL_API_SECRET }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
  OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
  SENDBYTE_API_KEY: ${{ secrets.SENDBYTE_API_KEY }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install the API's dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Pick the job
        id: pick
        env:
          SCHEDULE: ${{ github.event.schedule }}
          JOB: ${{ inputs.job }}
        run: |
          set -euo pipefail
          case "${SCHEDULE:-}" in
            "11 4 * * *"|"11 15 * * *") JOB=ingest ;;
            "17 6 * * *") JOB=label ;;
            "53 6 * * *") JOB=showcase ;;
            "37 * * * *") JOB=election-news ;;
          esac
          echo "job=${JOB}" >> "$GITHUB_OUTPUT"
      - name: Run the job
        run: python scripts/run_cron.py "/api/cron/${{ steps.pick.outputs.job }}"

      # Election news, full articles: web-harvester's crawler (github.com/HenryMorganDibie/web-harvester) reads the
      # article pages of new stories, robots.txt permitting and one page every two seconds per site; the stories are
      # then re-tagged from the full text. A crawl problem never fails the job: the headline tags stand.
      - name: Check out web-harvester
        if: steps.pick.outputs.job == 'election-news'
        uses: actions/checkout@v4
        with:
          repository: HenryMorganDibie/web-harvester
          path: web-harvester
      - uses: actions/setup-go@v5
        if: steps.pick.outputs.job == 'election-news'
        with:
          go-version-file: web-harvester/go.mod
          cache-dependency-path: web-harvester/go.sum
      - name: Read full articles with web-harvester
        if: steps.pick.outputs.job == 'election-news'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -euo pipefail
          (cd web-harvester && go build -o "$RUNNER_TEMP/crawl" ./cmd/crawl)
          python scripts/election_articles.py prepare "$RUNNER_TEMP/crawl.json" "$RUNNER_TEMP/pages.jsonl"
          "$RUNNER_TEMP/crawl" -config "$RUNNER_TEMP/crawl.json" -i-have-reviewed-tos
          python scripts/election_articles.py apply "$RUNNER_TEMP/pages.jsonl"

      - name: Read imported result sheets
        if: steps.pick.outputs.job == 'election-news'
        continue-on-error: true
        timeout-minutes: 28
        run: python scripts/run_cron.py /api/cron/sheet-queue
