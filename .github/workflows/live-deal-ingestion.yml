name: Live deal ingestion

on:
  schedule:
    # Run after the main African business-news announcement window; the endpoint scans a rolling 7 days.
    # Vercel also runs its independent daily cron. Keep this single Actions workflow budget-safe.
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: live-deal-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out main for the corporate-week archive
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Request short-lived GitHub Actions OIDC token
        id: oidc
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::GitHub Actions OIDC token endpoint is unavailable. Check the workflow id-token: write permission."
            exit 1
          fi
          response="$(curl --fail-with-body --silent --show-error --max-time 15 \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=deal-intelligence-api")"
          token="$(printf '%s' "$response" | jq -er '.value')"
          echo "::add-mask::${token}"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Collect recent deal announcements and deliver watchlist webhooks
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --max-time 240 \
            --retry 2 --retry-delay 5 --retry-all-errors \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Accept: application/json" \
            "https://deal-intelligence-api.vercel.app/api/cron/ingest"

      - name: Capture auditable country risk snapshots for all 54 markets
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --max-time 120 \
            --retry 2 --retry-delay 5 --retry-all-errors \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Accept: application/json" \
            "https://deal-intelligence-api.vercel.app/api/cron/country-snapshot"

      # A manual run also backfills each month of 2026. The API caps each request
      # to one month so timeouts and feed failures can be retried without losing progress.
      - name: Backfill 2026 deal and corporate-event history
        if: github.event_name == 'workflow_dispatch'
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          month="2026-01-01"
          current_month="$(date -u +%Y-%m-01)"
          while [[ "$month" < "$current_month" || "$month" == "$current_month" ]]; do
            month_key="$(date -u -d "$month" +%Y-%m)"
            echo "Backfilling ${month_key}"
            curl --fail-with-body --silent --show-error \
              --max-time 240 \
              --retry 2 --retry-delay 5 --retry-all-errors \
              -H "Authorization: Bearer ${OIDC_TOKEN}" \
              -H "Accept: application/json" \
              "https://deal-intelligence-api.vercel.app/api/cron/ingest?month=${month_key}"
            month="$(date -u -d "$month + 1 month" +%Y-%m-01)"
          done

      - name: Refresh Corporate of the Week from the updated database
        run: |
          set -euo pipefail
          python scripts/corporate_of_week.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/corporate-of-week.json
          if git diff --cached --quiet; then
            echo "Corporate of the Week archive is unchanged."
          else
            git commit -m "Refresh Corporate of the Week archive"
            git push origin HEAD:main
          fi
