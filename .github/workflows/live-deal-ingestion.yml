name: Live deal ingestion

on:
  schedule:
    # Deals are refreshed twice a day by scheduled-api-jobs.yml (04:11 and 15:11 UTC). This run is the nightly
    # maintenance pass, run on GitHub's runner rather than as a Vercel function:
    # it re-scans the rolling 7 days as a backstop, records country risk and refreshes Corporate
    # of the Week. GitHub often starts scheduled runs hours late, so nothing time-critical rests on it.
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-deal-ingestion
  cancel-in-progress: false

env:
  SUPABASE_URL: https://ygvpormskihofvgntldo.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_oEqYxYLm60MdGk5JA-QfgQ_6z7uSozn
  DEAL_INTEL_APP_URL: https://deal-intelligence.app
  DEAL_INTEL_API_SECRET: ${{ secrets.DEAL_INTEL_API_SECRET }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
  OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
  SENDBYTE_API_KEY: ${{ secrets.SENDBYTE_API_KEY }}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out main for the corporate-week archive
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install the API's dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Collect recent deals, deliver watchlist alerts, and record country risk for all 54 markets
        run: python scripts/run_cron.py /api/cron/ingest /api/cron/country-snapshot

      # A manual run also backfills each month of 2026, one month per call so a failure costs one month.
      - name: Backfill 2026 deal and corporate-event history
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          month="2026-01-01"
          current_month="$(date -u +%Y-%m-01)"
          paths=()
          while [[ "$month" < "$current_month" || "$month" == "$current_month" ]]; do
            paths+=("/api/cron/ingest?month=$(date -u -d "$month" +%Y-%m)")
            month="$(date -u -d "$month + 1 month" +%Y-%m-01)"
          done
          python scripts/run_cron.py "${paths[@]}"

      - name: Refresh Corporate of the Week from the updated database
        run: |
          set -euo pipefail
          python scripts/corporate_of_week.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/corporate-of-week.json
          if git diff --cached --quiet; then
            echo "Corporate of the Week archive is unchanged."
          else
            git commit -m "Refresh Corporate of the Week archive"
            bash scripts/push_with_retry.sh main
          fi
