name: Near-real-time deal ingestion

on:
  push:
    paths:
      - ".github/workflows/near-real-time-ingest.yml"
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: near-real-time-deal-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request short-lived GitHub Actions OIDC token
        id: oidc
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::GitHub Actions OIDC token endpoint is unavailable. Check the workflow id-token: write permission."
            exit 1
          fi
          response="$(curl --fail-with-body --silent --show-error --max-time 15 \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=deal-intelligence-api")"
          token="$(printf '%s' "$response" | jq -er '.value')"
          echo "::add-mask::${token}"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Collect recent deal announcements and deliver watchlist webhooks
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --max-time 240 \
            --retry 2 --retry-delay 5 --retry-all-errors \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Accept: application/json" \
            "https://deal-intelligence-api.vercel.app/api/cron/ingest"
