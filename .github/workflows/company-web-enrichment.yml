name: Company website enrichment

# Company profiles enqueue work immediately; this worker drains the queue independently
# of election ingestion. A bounded batch of sites is processed on each five-minute run.
on:
  # Bootstrap the worker on the first main-branch workflow update as well as on its
  # recurring schedule. This gives us a real runner execution to verify the setup.
  push:
    branches: [main]
    paths:
      - ".github/workflows/company-web-enrichment.yml"
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: company-website-enrichment
  cancel-in-progress: false

env:
  SUPABASE_URL: https://ygvpormskihofvgntldo.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_oEqYxYLm60MdGk5JA-QfgQ_6z7uSozn
  DEAL_INTEL_APP_URL: https://deal-intelligence.app
  DEAL_INTEL_API_SECRET: ${{ secrets.DEAL_INTEL_API_SECRET }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
  TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore Python environment cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/deal-intel-venv
          key: company-python-${{ runner.os }}-3.13-${{ hashFiles('requirements.txt') }}

      - name: Install API dependencies when the environment cache is cold
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.cache/deal-intel-venv/bin/python" ]; then
            python -m venv "$HOME/.cache/deal-intel-venv"
            "$HOME/.cache/deal-intel-venv/bin/python" -m pip install --disable-pip-version-check -r requirements.txt
          else
            echo "Using cached Python environment"
          fi

      - name: Prepare queued company sites
        id: prepare
        run: |
          set -euo pipefail
          status=0
          "$HOME/.cache/deal-intel-venv/bin/python" scripts/company_web.py prepare "$RUNNER_TEMP/company-crawl.json" "$RUNNER_TEMP/company-pages.jsonl" "$RUNNER_TEMP/companies.json" || status=$?
          if [ "$status" = "3" ]; then
            echo "No company sites queued"
            echo "sites=0" >> "$GITHUB_OUTPUT"
            echo "targets=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" != "0" ]; then exit "$status"; fi
          echo "sites=$(python -c 'import json,sys; print(len(json.load(open(sys.argv[1]))))' "$RUNNER_TEMP/companies.json")" >> "$GITHUB_OUTPUT"
          echo "targets=$(python -c 'import json,sys; print(len(json.load(open(sys.argv[1])).get("targets", [])))' "$RUNNER_TEMP/company-crawl.json")" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.prepare.outputs.targets != '0'
        with:
          repository: HenryMorganDibie/web-harvester
          path: web-harvester

      - uses: actions/setup-go@v5
        if: steps.prepare.outputs.targets != '0'
        with:
          go-version-file: web-harvester/go.mod
          cache-dependency-path: web-harvester/go.sum

      - name: Restore crawler and browser cache
        if: steps.prepare.outputs.targets != '0'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deal-intel-web-harvester
            ~/.cache/ms-playwright-go
            ~/.cache/ms-playwright
          key: company-crawler-${{ runner.os }}-${{ hashFiles('web-harvester/go.sum') }}-playwright-1.60.0

      - name: Build crawler
        if: steps.prepare.outputs.targets != '0'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/deal-intel-web-harvester"
          if [ ! -x "$HOME/.cache/deal-intel-web-harvester/crawl" ]; then
            (cd web-harvester && go build -o "$HOME/.cache/deal-intel-web-harvester/crawl" ./cmd/crawl)
          fi

      - name: Restore browser renderer when cache is cold
        if: steps.prepare.outputs.targets != '0'
        id: browser
        run: |
          set -euo pipefail
          DRIVER="$HOME/.cache/ms-playwright-go/1.60.0/node"
          BROWSER="$(find "$HOME/.cache/ms-playwright" -maxdepth 1 -type d -name 'chromium-*' -print -quit 2>/dev/null || true)"
          if [ ! -x "$DRIVER" ] || [ -z "$BROWSER" ]; then
            if (cd web-harvester && sh scripts/install-playwright.sh); then
              echo "render=auto" >> "$GITHUB_OUTPUT"
            else
              echo "Playwright unavailable; continuing with plain HTTP"
              echo "render=off" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Using cached Playwright driver and Chromium"
            echo "render=auto" >> "$GITHUB_OUTPUT"
          fi

      - name: Crawl company websites
        if: steps.prepare.outputs.targets != '0'
        env:
          HARVESTER_RENDER: ${{ steps.browser.outputs.render }}
        run: |
          set -euo pipefail
          "$HOME/.cache/deal-intel-web-harvester/crawl" -config "$RUNNER_TEMP/company-crawl.json" -i-have-reviewed-tos

      - name: Install OCR only when a queued filing or discovered annual report needs it
        if: steps.prepare.outputs.sites != '0'
        run: |
          if python - "$RUNNER_TEMP/companies.json" "$RUNNER_TEMP/company-pages.jsonl" <<'PY'
          import json, re, sys
          companies = json.load(open(sys.argv[1]))
          try:
              pages = [json.loads(line) for line in open(sys.argv[2]) if line.strip()]
          except FileNotFoundError:
              pages = []
          filing = any(c.get("filing_url") for c in companies)
          report = any(
              isinstance(url, str)
              and url.lower().endswith(".pdf")
              and re.search(r"(annual|integrated)[\W_]*(report|financial[\W_]*statements?|results)", url, re.I)
              for page in pages for url in (page.get("links") or [])
          )
          raise SystemExit(0 if filing or report else 1)
          PY
          then
            sudo apt-get update -qq
            sudo apt-get install -y -qq tesseract-ocr poppler-utils
          else
            echo "No queued filing or discovered annual report PDFs; skipping OCR system packages"
          fi

      - name: Extract and persist company facts
        if: steps.prepare.outputs.sites != '0'
        run: "$HOME/.cache/deal-intel-venv/bin/python" scripts/company_web.py apply "$RUNNER_TEMP/company-pages.jsonl" "$RUNNER_TEMP/companies.json"
