name: Python quality gates

on:
  pull_request:
    branches: [main]
    paths:
      - "main.py"
      - "api/**/*.py"
      - "src/**/*.py"
      - "scripts/**/*.py"
      - "tests/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - "pytest.ini"
      - "ruff.toml"
      - "evaluation/**/*.py"
      - ".github/workflows/python-quality-gates.yml"
  push:
    branches: [main]
    paths:
      - "main.py"
      - "api/**/*.py"
      - "src/**/*.py"
      - "scripts/**/*.py"
      - "tests/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - "pytest.ini"
      - "ruff.toml"
      - "evaluation/**/*.py"
      - ".github/workflows/python-quality-gates.yml"

permissions:
  contents: read

concurrency:
  group: python-quality-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-backtest.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-backtest.txt
      - name: Lint for correctness (undefined and unused names, duplicate keys)
        run: python -m pip install ruff==0.16.9 && ruff check .
      - name: Run full test suite
        run: python -m pytest -q
      - name: Recompute duplicate-detection metrics
        run: python -c "import json; from evaluation.deals.score import dedup; print(json.dumps(dedup()[0], indent=2))"
