name: Enrich round investors

# Reads the articles of funding rounds that name no investor and records the investors they name (lead and
# participants), each with the sentence that names it. Daily after ingestion for new rounds; a manual run
# keeps going until the backlog is cleared, which is how the history is backfilled.
on:
  schedule:
    - cron: "4 19 * * *"            # after the 18:17 live ingestion
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enrich-round-investors
  cancel-in-progress: false

env:
  SUPABASE_URL: https://ygvpormskihofvgntldo.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_oEqYxYLm60MdGk5JA-QfgQ_6z7uSozn
  DEAL_INTEL_APP_URL: https://deal-intelligence.app
  DEAL_INTEL_API_SECRET: ${{ secrets.DEAL_INTEL_API_SECRET }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
  OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
  SENDBYTE_API_KEY: ${{ secrets.SENDBYTE_API_KEY }}

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install the API's dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Read round articles in batches
        run: |
          set -euo pipefail
          # Scheduled runs take three batches of new rounds; a manual run clears the backlog.
          max_batches=3
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then max_batches=60; fi
          python scripts/run_cron.py --until-empty "$max_batches" "/api/cron/enrich-rounds?limit=40"
