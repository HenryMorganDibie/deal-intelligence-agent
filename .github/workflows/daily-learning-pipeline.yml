name: Daily learning pipeline

on:
  push:
    branches:
      - main
    paths:
      - "scripts/daily_pipeline.py"
      - "scripts/refresh_current_macro_signals.py"
  schedule:
    # Twice a day. The repository is public, so hosted runners are free. GitHub often starts
    # scheduled runs late at busy hours, so each slot is set early enough to absorb a delay:
    #   04:37 UTC, ready before the African working day (05:37 Lagos, 06:37 Johannesburg, 07:37 Nairobi)
    #   14:37 UTC, after the Lagos and Nairobi closes and into the Johannesburg close
    # The morning run also refreshes the slow-moving reference data (see the steps below).
    - cron: "37 4 * * *"
    - cron: "37 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-learning-pipeline
  cancel-in-progress: false

jobs:
  collect-train-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-backtest.txt

      - name: Install pipeline dependencies
        run: pip install -r requirements-backtest.txt

      - name: Refresh World Bank country indicators monthly (or on manual run)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '37 4 * * *'
        run: |
          set -euo pipefail
          day="$(date -u +%d)"
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || { [ "$((10#$day))" -le 7 ] && [ "$(date -u +%u)" = "7" ]; }; then
            python main.py countries --refresh
          else
            echo "Not the first Sunday of the month; annual country indicators remain unchanged."
          fi

      # Monthly and current-period figures: once a day is enough and keeps within the free API plan.
      - name: Refresh higher-frequency Africa API country signals
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.schedule == '37 4 * * *'
        env:
          AFRICA_API_KEY: ${{ secrets.AFRICA_API_KEY }}
        run: python scripts/refresh_current_macro_signals.py

      - name: Refresh official merger-control filings (COMESA, South Africa) weekly
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '37 4 * * *'
        continue-on-error: true            # an authority's site being down never blocks the daily pipeline
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || [ "$(date -u +%u)" = "1" ]; then
            python scripts/refresh_merger_filings.py
          else
            echo "Not Monday; merger filings refresh weekly."
          fi

      - name: Collect review data, gather financials, build graph and evaluate models
        run: python scripts/daily_pipeline.py

      - name: Commit generated outputs directly to main
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const paths = [
              'docs/automation/event_label_queue.jsonl',
              'docs/automation/entity_match_queue.jsonl',
              'docs/automation/financial_observations.jsonl',
              'docs/automation/financial_collection_attempts.jsonl',
              'docs/automation/relationship_graph.json',
              'docs/automation/ranking_evaluation.json',
              'docs/automation/learned_ranker.json',
              'docs/automation/learning_pipeline.json',
              'docs/automation/event_classifier_evaluation.json',
              'docs/automation/event_classifier.json',
              'src/data/country_indicators.json',
              'src/data/current_macro_signals.json',
              'src/data/merger_filings.json',
              'docs/automation/entity_match_evaluation.json',
              'docs/automation/entity_matcher.json',
              'web/data/investment_ideas.json',
            ];
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            for (let attempt = 1; attempt <= 5; attempt++) {
              const ref = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
              const baseSha = ref.data.object.sha;
              const baseCommit = await github.rest.git.getCommit({ owner, repo, commit_sha: baseSha });
              const baseTree = await github.rest.git.getTree({
                owner, repo, tree_sha: baseCommit.data.tree.sha, recursive: '1',
              });
              const existing = new Map((baseTree.data.tree || []).map(entry => [entry.path, entry.sha]));
              const tree = [];
              for (const path of paths) {
                if (!fs.existsSync(path)) continue;
                const content = fs.readFileSync(path, 'utf8');
                const blob = await github.rest.git.createBlob({ owner, repo, content, encoding: 'utf-8' });
                if (existing.get(path) !== blob.data.sha) {
                  tree.push({ path, mode: '100644', type: 'blob', sha: blob.data.sha });
                }
              }
              if (!tree.length) {
                core.info('No generated output changes to publish.');
                return;
              }
              const nextTree = await github.rest.git.createTree({
                owner, repo, base_tree: baseCommit.data.tree.sha, tree,
              });
              const commit = await github.rest.git.createCommit({
                owner, repo,
                message: 'Refresh daily research and model evaluation data',
                tree: nextTree.data.sha,
                parents: [baseSha],
              });
              try {
                await github.rest.git.updateRef({
                  owner, repo, ref: 'heads/main', sha: commit.data.sha, force: false,
                });
                core.info(`Published ${tree.length} generated files directly to main at ${commit.data.sha}.`);
                return;
              } catch (error) {
                if (error.status === 422 && attempt < 5) {
                  core.warning(`main moved during publish (attempt ${attempt}); rebuilding on latest main.`);
                  continue;
                }
                throw error;
              }
            }
            throw new Error('Could not publish generated outputs after five concurrent-main retries.');
