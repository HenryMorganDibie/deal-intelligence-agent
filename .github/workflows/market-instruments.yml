name: Market instruments

# ETFs, Treasury bills, bonds, central bank policy rates, deposit rates and unlisted funds. Run on GitHub's runner
# every weekday after the African closes (the quote snapshot runs separately on Vercel at 17:23 UTC). Until this
# schedule existed the refresh ran only when the Market snapshot workflow was started by hand.
on:
  schedule:
    - cron: "47 17 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-instruments
  cancel-in-progress: false

env:
  SUPABASE_URL: https://ygvpormskihofvgntldo.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_oEqYxYLm60MdGk5JA-QfgQ_6z7uSozn
  DEAL_INTEL_APP_URL: https://deal-intelligence.app
  DEAL_INTEL_API_SECRET: ${{ secrets.DEAL_INTEL_API_SECRET }}

jobs:
  instruments:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install the API's dependencies
        run: pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Refresh ETFs, Treasury bills, bonds, policy and deposit rates, unlisted funds
        run: python scripts/run_cron.py /api/cron/market-instruments
