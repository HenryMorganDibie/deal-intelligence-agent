name: Market instruments

# ETFs, Treasury bills, bonds, central bank policy rates and deposit rates, every weekday after the African closes
# (the quote snapshot runs separately at 17:23 UTC). The refresh runs on Vercel's Paris function, not on GitHub's
# runner: Bank Al-Maghrib, like the Tunis board, refuses requests from the US addresses GitHub's runners use, which
# left Morocco's policy rate, Treasury bills and deposit rates out.
on:
  schedule:
    - cron: "47 17 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: market-instruments
  cancel-in-progress: false

jobs:
  instruments:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refresh instruments (on Vercel, from Paris)
        run: |
          set -euo pipefail
          oidc="$(curl --fail-with-body --silent --show-error --max-time 15 \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=deal-intelligence-api" | jq -er '.value')"
          echo "::add-mask::${oidc}"
          curl --fail-with-body --silent --show-error --max-time 295 \
            -H "Authorization: Bearer ${oidc}" -H "Accept: application/json" \
            "https://api.deal-intelligence.app/api/cron/market-instruments"
